name: Build CueDesk Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App & Sync to Android
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuedesk-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: CueDesk Android APK (Direct Install)
          body: |
            ## 📱 CueDesk Android APK (Self-Contained Sideload Build)

            ### What's included:
            - **Hardcoded Client Keys**: Cerebras + Groq + Deepgram running directly on your phone.
            - **Pure 16kHz Audio Capture**: Noise cancellation ducking disabled so phone mic hears laptop speakers clearly.
            - **Permanent Keep-Screen-On**: Screen never sleeps during live interviews.
            - **Runnable Script vs Function Only Dropdown**: Toggle optimal code with runner or pure function for pasting.
            - **Vivid Golden Yellow Code Comments**: Comments highlighted for fast reading.
            - **Dynamic Copy**: Copies currently selected code view.

            ### How to install on your phone:
            1. Download `app-debug.apk` below.
            2. Tap the downloaded file on your Android device.
            3. If prompted, allow "Install from Unknown Sources".
            4. Grant Microphone permission when prompted on first launch.
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
